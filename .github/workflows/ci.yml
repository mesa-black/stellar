# What runs on every push, and what a push to main delivers.
#
# Four jobs. `test` is the build stage of the Dockerfile and nothing else: the
# format check, vet and the tests run there, in the very toolchain the image
# is compiled with, so the runner needs Docker and no Go of its own. `image`
# publishes what was tested, and `deploy` tells the deployment repository
# which image to run. `release` runs for a version tag only: it publishes the
# command line as binaries.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet and tests
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        # The build stage fails if a file is not gofmt-ed, if vet complains or
        # if a test fails. Among the tests: the 32 reference constellations of
        # testdata/v1.json, which other implementations reproduce — a change
        # that moved one star would stop here.
        name: Run the checks in the build stage
        run: docker build --target build .
      -
        # The browser extension carries its own port of the mapping, in
        # JavaScript: the same 32 reference constellations, or it stops here.
        name: Check the extension's port of the mapping
        run: node extension/test.js
      -
        # The pages carry a script that no other test runs. This opens the
        # site in a headless Firefox and acts on it as a visitor would: the
        # first visit, a private key refused before it is sent, a key
        # confirmed, a key refused, the chart turning.
        name: Open the site in a real browser
        run: make browser ENGINE=docker

  # ---------------------------------------------------------------- delivery
  # Only for a push to main, and only once the checks pass.
  image:
    name: Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # The repository's default token is read-only; this job alone may write
    # packages. No personal token involved: the image is pushed by the
    # workflow's own GITHUB_TOKEN, which expires with the run.
    permissions:
      contents: read
      packages: write
    # The digest of what was pushed: the deployment pins it next to the tag.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        # Two architectures without QEMU: the build stage runs on the runner's
        # own platform and cross-compiles, the final stage only copies files.
        #
        # Tagged with the full commit SHA, never `latest`: the deployment
        # repository names exactly which build runs, and going back is a revert.
        name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mesa-black/stellar:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Stellar, a public key drawn as a constellation: the website, one static binary
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps: CI never talks to the cluster. It changes one line in the
  # deployment repository, and Argo CD, which watches that repository, does the
  # rest. A deployment is therefore a commit there: history, review, and
  # `git revert` as the rollback.
  deploy:
    name: Deploy via Argo CD
    needs: image
    runs-on: ubuntu-26.04
    # Two pushes in a row must not race each other's commit. Queued, never
    # cancelled: a cancelled deploy would leave the older image running.
    concurrency:
      group: deploy-stellar
      cancel-in-progress: false
    steps:
      -
        # A deploy key with write access to k3s-stack, and to nothing else.
        # Its private half is a secret of this repository.
        name: Checkout the deployment repository
        uses: actions/checkout@v7
        with:
          repository: mesa-black/k3s-stack
          ssh-key: ${{ secrets.K3S_STACK_DEPLOY_KEY }}
          path: k3s-stack
      -
        # yq rather than `kustomize edit set image`: kustomize rewrites the whole
        # file and drops its comments. The tag names the commit, the digest the
        # bytes: an image pushed again under the same tag never reaches a node.
        name: Point Stellar at this build
        working-directory: k3s-stack
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "no digest for stellar" >&2; exit 1 ;; esac
          yq -i "(.images[] | select(.name == \"ghcr.io/mesa-black/stellar\")) |= (.newTag = \"${{ github.sha }}\" | .digest = \"$DIGEST\")" \
            spoke/apps/stellar/kustomization.yaml
          git diff --stat
      -
        # The message carries the source commit, so that the deployment history
        # leads back to the code. A re-run with nothing to change commits nothing.
        name: Commit and push
        working-directory: k3s-stack
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          git diff --quiet && { echo "already deployed"; exit 0; }
          # First line of the source commit's message. Computed here: inside a
          # here-document, $'\n' quoting is not interpreted.
          subject=${SUBJECT%%$'\n'*}
          git config user.name 'stellar CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -a -F - <<MSG
          stellar: deploy ${GITHUB_SHA::7}

          ${subject}

          https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          MSG
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 3))
          done
          exit 1

  # A deployment is done when visitors are served by it, not when a line has
  # changed in another repository: Argo CD takes a few minutes, and a pod
  # that never becomes ready would leave the old build serving under a green
  # pipeline. This waits until the site answers with this very commit, five
  # times in a row since two builds answer in turn while one replaces the
  # other, then asks it what a visitor would.
  live:
    name: Served, and answering
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Wait for this build to be the one that answers
        run: |
          in_a_row=0
          for attempt in $(seq 1 90); do
            served=$(curl -fsS -m 10 https://stellar.mesa.black/version || true)
            if [ "$served" = "$GITHUB_SHA" ]; then
              in_a_row=$((in_a_row + 1))
              [ "$in_a_row" -ge 5 ] && { echo "served: $served"; exit 0; }
              sleep 2
            else
              in_a_row=0
              sleep 10
            fi
          done
          echo "after fifteen minutes the site still answers '$served', not $GITHUB_SHA" >&2
          exit 1
      -
        name: Ask it what a visitor would
        run: tools/probe https://stellar.mesa.black

  # ----------------------------------------------------------------- release
  # A version tag publishes the command line: one static binary per platform
  # and their checksums, attached to a GitHub release whose text is the tag's
  # own message. The website does not wait for a tag; it follows main.
  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      -
        # The whole history is not needed, the tag's own object is: its
        # message is the release's text.
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          ref: ${{ github.ref }}
      -
        name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build the binaries
        run: docker build --target dist --build-arg "VERSION=$GITHUB_REF_NAME" --output dist .
      -
        name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ( cd dist && sha256sum -c SHA256SUMS )
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
